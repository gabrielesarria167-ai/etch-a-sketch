<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Etch-a-Sketch</title>
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <link href="styles.css" rel=stylesheet>
    <script src="script.js" defer></script>
</head>

<body>
    <div id="options-board">

        <form id="color-selection">
            <label for = "rgb-picker" id = "rgb-text">Click here to select color</label>
            <input type="color" id = "rgb-picker" name = "rgb-picker">
        </form>

        <form id="dimensions-selection">
            <label id="slider-text" for="slider">Select the dimensions of the board here:</label>
            <input type="range" id="slider" name="slider">
            <div id="slider-dimension"></div>
        </form>
        <button id="reset">reset</button>
    </div>
    <div id = "hoverStatus"></div>
    <div id="container"></div>
</body>

</html>
